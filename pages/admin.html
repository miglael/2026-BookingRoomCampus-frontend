<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Room Booking</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h2>Admin Panel</h2>
    <p>Login sebagai: <span id="adminEmail"></span></p>

    <button onclick="logout()">Logout</button>

    <hr>

    <h3>Daftar Booking</h3>
    <h3>Pencarian Booking Berdasarkan ID</h3>
<input type="number" id="searchId" placeholder="Masukkan ID booking...">
<button onclick="searchBookingById()">Cari</button>
<button onclick="loadBookings()">Reset</button>
    <hr>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Peminjam</th>
                <th>Ruangan</th>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="bookingTable"></tbody>
    </table>

    <script src="../js/auth.js"></script>
<script src="../js/api.js"></script>

<script>
requireAdmin();
document.getElementById("adminEmail").innerText = getUserEmail();

loadBookings();


// ==========================
// LOAD BOOKING DEFAULT
// ==========================
async function loadBookings(query = "") {
    const bookings = await getBookings(query);
    renderBookings(bookings);
}


// ==========================
// RENDER TABLE (SATU SAJA)
// ==========================
function renderBookings(bookings) {
    const table = document.getElementById("bookingTable");
    table.innerHTML = "";

    bookings.forEach(b => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${b.id}</td>
            <td>${b.namaPeminjam}</td>
            <td>${b.ruangan}</td>
            <td>${b.tanggal.split("T")[0]}</td>
            <td>${b.jamMulai} - ${b.jamSelesai}</td>
            <td>${b.status}</td>
            <td>
                <button onclick="setStatus(${b.id}, 'Disetujui')">Setujui</button>
                <button onclick="setStatus(${b.id}, 'Ditolak')">Tolak</button>
                <button onclick="deleteBookingConfirm(${b.id})">Hapus</button>
            </td>
        `;

        table.appendChild(row);
    });
}


// ==========================
// SEARCH
// ==========================
async function searchBookingById() {
    const id = document.getElementById("searchId").value;

    if (!id) {
        alert("Masukkan ID dulu");
        return;
    }

    try {
        const booking = await getBookingById(id);

        renderBookings([booking]);

    } catch (err) {
        alert("Booking tidak ditemukan");
    }
}





// ==========================
// UPDATE STATUS
// ==========================
async function setStatus(id, status) {
    await updateBookingStatus(id, status);
    loadBookings();
}


// ==========================
// DELETE
// ==========================
async function deleteBookingConfirm(id) {
    if (!confirm("Yakin mau hapus booking ini?")) return;

    await deleteBooking(id);
    loadBookings();
}
</script>


</body>
</html>
